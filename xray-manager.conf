[program:seed]
command=/bin/sh -c 'if [ ! -s /root/xray-manager/config/xray-multi-socks.json ] && [ -f /opt/derwalld/templates/xray-multi-socks.json ]; then cp /opt/derwalld/templates/xray-multi-socks.json /root/xray-manager/config/xray-multi-socks.json; echo "seeded default config"; fi; if [ ! -f /root/xray-manager/state/token ]; then echo 123456 > /root/xray-manager/state/token; chmod 600 /root/xray-manager/state/token; echo "seeded token"; fi; for g in geoip.dat geosite.dat; do if [ ! -f /root/xray-manager/data/$g ] && [ -f /opt/derwalld/templates/geo/$g ]; then cp /opt/derwalld/templates/geo/$g /root/xray-manager/data/$g.part && mv /root/xray-manager/data/$g.part /root/xray-manager/data/$g; echo "seeded $g"; fi; done'
autostart=true
autorestart=false
startsecs=0
priority=5

[program:init]
command=/bin/sh -c 'for g in geoip.dat geosite.dat; do ln -sf /root/xray-manager/data/$g /opt/derwalld/bin/$g; done; echo "init done" && exit 0'
autostart=true
autorestart=false
startsecs=0
priority=10

[program:xray]
command=/bin/sh -c 'for i in $(seq 1 60); do [ -s /root/xray-manager/data/geoip.dat ] && [ -s /root/xray-manager/data/geosite.dat ] && break; sleep 0.5; done; exec python3 /opt/derwalld/xray-entrypoint.py --source /root/xray-manager/config/xray-multi-socks.json --runtime /root/xray-manager/config/xray-runtime.json --cache /root/xray-manager/state/txt-endpoint-cache.json --xray /opt/derwalld/bin/der'
autostart=true
autorestart=true
startsecs=2
priority=20
stdout_logfile=/root/xray-manager/logs/xray.log
stderr_logfile=/root/xray-manager/logs/xray.err
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:xray-panel]
command=python3 /opt/derwalld/app.py --host 0.0.0.0 --port %(ENV_PANEL_PORT)s --xray-config /root/xray-manager/config/xray-multi-socks.json --xray-binary /opt/derwalld/bin/der --service xray
autostart=true
autorestart=true
startsecs=2
priority=30
stdout_logfile=/root/xray-manager/logs/panel.log
stderr_logfile=/root/xray-manager/logs/panel.err
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

[group:xray-all]
programs=seed,init,xray,xray-panel
